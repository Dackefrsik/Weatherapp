name: CI Workflow

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install
        working-directory: ./Weatherapp

      - name: Run tests
        run: npm test
        working-directory: ./Weatherapp
        env:
          API_KEY: ${{ secrets.API_KEY}}
