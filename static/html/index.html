<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#f8f9fa"/> <!--Ändrar fägren på utrymmet ovanför navbar på exempelvis en Iphone-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/style.cssS">
    <title>Weather</title>
</head>
<body class="bg-success-subtle">
    <!-- #region Header-->
    <header class="container-fluid d-flex justify-content-center bg-light">
        <div id="clock">
        </div> 
    </header>
    <!--#endregion-->

    <!-- #region navbar-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid d-flex flex-column">
            <button class="navbar-toggler collapsed mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="toggler-icon top-bar"></span>
                <span class="toggler-icon middle-bar"></span>
                <span class="toggler-icon bottom-bar"></span>
            </button>
            <div class="row collapse navbar-collapse row d-flx justify-content-between" id="navbarSupportedContent">
                <ul class="navbar-nav mb-2 mb-lg-0 col-sm-2 d-none d-md-flex flex-row ms-2">
                    <li class="nav-item ">
                        <div class="btn btn-lg btn-primary" id="map">Map</div>
                    </li>
                    <li class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-compass compass mx-3 mt-2" viewBox="0 0 16 16">
                        <path d="M8 16.016a7.5 7.5 0 0 0 1.962-14.74A1 1 0 0 0 9 0H7a1 1 0 0 0-.962 1.276A7.5 7.5 0 0 0 8 16.016m6.5-7.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/>
                        <path d="m6.94 7.44 4.95-2.83-2.83 4.95-4.949 2.83 2.828-4.95z"/>
                        </svg>
                    </li>
                </ul>
                <form class="d-flex col-md-4 col-lg-3 col-xl-2" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-lg btn-outline-success text-align-center" type="submit">Search</button>
                </form>
            </div>
            
        </div>
    </nav>
    <!-- #endregion-->

    <!-- #region Innehåll i main-->
      <main class="col-12 ">
        <h1 id="h1" class="d-flex justify-content-center"></h1>
        <div id="container" class="col-12">
            <div class="row col-12">
                <div class="d-flex justify-content-center col-12">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d32459.57605182724!2d13.4448174!3d59.437685900000005!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ssv!2sse!4v1697644762467!5m2!1ssv!2sse" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="iframemap d-none mt-3"></iframe>
                    
                    <div id="show-weather" class="col-md-5 col-sm-2 d-flex flex justify-content-end align-item-center pb-5">
                    </div>
                    <div class="col-2 d-none d-md-block"></div>
                    <div id="show-next-hour" class="col-sm-2 col-md-1 d-flex flex-column justify-content-start">

                    </div>
                    <div id="hour-temp" class="col-sm-2 col-md-4 d-flex flex-column justify-content-start ms-2 ms-md-none">

                    </div>
                </div>
            </div>
            <div class="row col-12">
                <div id="condition">

                </div>
            </div>
        </div>
    </main>
    <!-- #endregion-->

    <!-- #region footer-->
    <footer class="fixed-bottom bg-light col-12 py-2">
        <p class="mt-3 mb-3 text-center text-body-secondary">© 2024 Weather, Inc</p>
    </footer>
    <!-- #endregion-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>    <script src="../js/client-script.js"></script>
    <script src="../js/client-script.js"></script>
</body>
</html>
